[package]
name = "mnemo-rs"
version = "1.6.20"
edition = "2021"
description = "Local-first shell history manager with CLI/TUI, fuzzy search, project/session context, and DevSecOps-focused release hardening."
license = "MIT"
authors = ["Killian Van Ruymbeke"]
readme = "README.md"
repository = "https://github.com/Vesperis-group/mnemo"
homepage = "https://github.com/Vesperis-group/mnemo"
keywords = ["cli", "shell", "history", "sqlite", "tui"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
    ".github/**",
    "target/**",
    "fuzz/target/**",
    "node_modules/**",
    "docs/assets/*.mp4",
    "package.json",
    "package-lock.json",
    "release-it.json",
    "dist/**",
    "out/**",
    "coverage/**",
    "*.log",
]

[lib]
name = "mnemo"
path = "src/lib.rs"

[[bin]]
name = "mnemo"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
rusqlite = { version = "0.40", features = ["bundled"] }
ratatui = "0.30"
crossterm = "0.29"
nucleo-matcher = "0.3"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
serde_json = "1.0"
dirs = "6.0"
anyhow = "1.0"
tar = "0.4"
flate2 = "1.0"
ureq = "3.3"
sha2 = "0.11"

[dev-dependencies]
tempfile = "3.10"
tar = "0.4"
flate2 = "1.0"
sha2 = "0.11"

[profile.release]
strip = true
lto = true
opt-level = "z"
codegen-units = 1
