name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality gate (fmt, clippy, tests, build)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust (pinned via rust-toolchain.toml)
        run: |
          rustup show
          rustc --version
          rustup show active-toolchain

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          prefix-key: v0-rust-ubuntu2204

      - name: Fetch dependencies (locked)
        run: cargo fetch --locked

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --locked

      - name: Build release (sanity)
        run: cargo build --locked --release

      - name: Build musl (sanity)
        run: cargo build --locked --release --target x86_64-unknown-linux-musl

      - name: Shell scripts syntax check
        run: |
          bash -n scripts/install.sh
          bash -n scripts/uninstall.sh
          bash -n scripts/lib/bashrc.sh
          bash -n scripts/package-release.sh

  audit:
    name: Audit supply chain (deny, audit, gitleaks)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - name: Checkout (historique complet pour gitleaks)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Rust (pinned via rust-toolchain.toml)
        run: |
          rustup show
          rustc --version
          rustup show active-toolchain

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Fetch dependencies (locked)
        run: cargo fetch --locked

      - name: Install audit tools (versions exactes)
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.19.8 --locked

      - name: Print tool versions
        run: |
          cargo audit --version
          cargo deny --version

      - name: cargo audit (vulnérabilités RustSec)
        run: cargo audit

      - name: cargo deny check (licences, avis, sources)
        run: cargo deny check

      - name: Install gitleaks CLI (checksum vérifié)
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.27.2"
          GITLEAKS_SHA256="141c3b2dede46d8b3a53b47116da756bd223decc0374797559a6b50ecba5590c"
          curl -fsSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks
        run: gitleaks detect --source . --redact --verbose --exit-code 1

  publish:
    name: Build Linux (musl + glibc2.35) et publication
    needs: [quality, audit]
    if: ${{ success() && !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write # commit, tag, push, création de release
      pull-requests: read # lecture du contexte des PR (changelog)
      id-token: write # OIDC keyless pour cosign (sign-blob / attest-blob)
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.MNEMO_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.MNEMO_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: mnemo

      - name: Checkout (historique complet)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Setup Rust (pinned via rust-toolchain.toml)
        run: |
          rustup show
          rustc --version
          rustup show active-toolchain

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          prefix-key: v0-rust-ubuntu2204

      - name: Setup Node.js (.node-version)
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".node-version"
          cache: npm

      - name: Install release tooling
        run: npm ci

      - name: Audit des dépendances npm (prod)
        run: npm audit --omit=dev

      - name: Fetch dependencies (locked)
        run: cargo fetch --locked

      - name: Inspect binaries (file / ldd)
        run: |
          cargo build --locked --release
          cargo build --locked --release --target x86_64-unknown-linux-musl
          echo "== GNU/glibc =="
          file target/release/mnemo
          ldd target/release/mnemo || true
          echo "== musl (statique attendu) =="
          file target/x86_64-unknown-linux-musl/release/mnemo
          ldd target/x86_64-unknown-linux-musl/release/mnemo || true

      - name: Install cosign (pinned + checksum verified)
        env:
          COSIGN_VERSION: "3.1.1"
          COSIGN_SHA256: "ae1ecd212663f3693ad9edf8b1a183900c9a52d3155ba6e354237f9a0f6463fc"
        run: |
          set -euo pipefail
          url="https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
          curl -fsSL "${url}" -o /tmp/cosign
          echo "${COSIGN_SHA256}  /tmp/cosign" | sha256sum -c -
          sudo install -m 0755 /tmp/cosign /usr/local/bin/cosign
          rm -f /tmp/cosign
          cosign version

      - name: Install cargo-cyclonedx (pinned, locked)
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked

      - name: Print artifact-integrity tool versions
        run: |
          cosign version
          cargo cyclonedx --version

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run release-it
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: npm run release

      - name: Verify .intoto.jsonl asset in GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$(git describe --tags --abbrev=0)"
          echo "Assets de la release ${TAG} :"
          gh release view "${TAG}" --json assets \
            | jq -r '.assets[].name | "  " + .'

          gh release view "${TAG}" --json assets \
            | jq -e '[.assets[] | select(.name | endswith(".intoto.jsonl")) | select(.size > 0)] | length > 0' \
            || { echo "Erreur : aucun asset *.intoto.jsonl non vide dans la release ${TAG}"; exit 1; }
          echo "✓ Asset .intoto.jsonl non vide présent dans la release ${TAG}"
