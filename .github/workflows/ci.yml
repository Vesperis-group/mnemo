name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test, build)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust (pinned via rust-toolchain.toml)
        run: |
          rustup show
          rustc --version
          rustup show active-toolchain

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Fetch dependencies (locked)
        run: cargo fetch --locked

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --locked

      - name: Build release
        run: cargo build --locked --release

  scripts:
    name: Shell scripts (bash -n)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Syntax check
        run: |
          bash -n scripts/install.sh
          bash -n scripts/uninstall.sh
          bash -n scripts/lib/bashrc.sh
          bash -n scripts/package-release.sh

  runbook-smoke:
    name: Runbook smoke test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust (pinned via rust-toolchain.toml)
        run: |
          rustup show
          rustc --version
          rustup show active-toolchain

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Build release binary
        run: cargo build --locked --release

      - name: Initialise isolated HOME and database
        env:
          HOME: ${{ runner.temp }}/mnemo-runbook-smoke
        run: |
          set -euo pipefail
          mkdir -p "${HOME}"
          ./target/release/mnemo init

      - name: Inject test commands (with session ID)
        env:
          HOME: ${{ runner.temp }}/mnemo-runbook-smoke
          MNEMO_SESSION_ID: smoke-runbook-ci
        run: |
          set -euo pipefail
          ./target/release/mnemo add --cmd "echo hello world" --cwd "${PWD}" --exit-code 0
          ./target/release/mnemo add --cmd "git status" --cwd "${PWD}/src" --exit-code 0
          ./target/release/mnemo add --cmd "ls -la" --cwd "${PWD}/tests" --exit-code 0
          ./target/release/mnemo add --cmd "curl https://user:pass@example.com/data" --cwd "/tmp/mnemo-runbook-smoke" --exit-code 0

      - name: Smoke tests runbook
        env:
          HOME: ${{ runner.temp }}/mnemo-runbook-smoke
        run: |
          set -euo pipefail
          command -v jq >/dev/null
          secret_fragment="user:pass@"

          output="$(./target/release/mnemo runbook --last)"
          [ -n "${output}" ] || { echo "FAIL: --last produced empty output" >&2; exit 1; }
          echo "OK: --last produces non-empty output"

          echo "${output}" | grep -q "# Runbook" || { echo "FAIL: output missing '# Runbook'" >&2; exit 1; }
          echo "OK: output contains '# Runbook'"

          ./target/release/mnemo runbook --last --output "${HOME}/test-runbook.md"
          [ -f "${HOME}/test-runbook.md" ] || { echo "FAIL: output file not created" >&2; exit 1; }
          echo "OK: --output creates the file"

          limited="$(./target/release/mnemo runbook --last --limit 1)"
          echo "${limited}" | grep -q "^- Commands: 1$" || { echo "FAIL: --limit 1 did not limit to 1 command" >&2; exit 1; }
          echo "OK: --limit 1 includes exactly 1 command"

          json="$(./target/release/mnemo runbook --last --format json)"
          echo "${json}" | jq -e '.commands | type == "array" and length == 4' >/dev/null || { echo "FAIL: --format json output is invalid" >&2; exit 1; }
          echo "OK: --format json returns valid JSON"

          echo "${output}" | grep -q "${secret_fragment}" && { echo "FAIL: default output leaked raw credential" >&2; exit 1; }
          echo "${output}" | grep -Eq "\\[REDACTED\\]|\\[REDACTED COMMAND\\]" || { echo "FAIL: default output missing redaction marker" >&2; exit 1; }
          echo "OK: redaction is enabled by default"

          raw="$(./target/release/mnemo runbook --last --no-redact)"
          echo "${raw}" | grep -q "${secret_fragment}" || { echo "FAIL: --no-redact did not keep raw credential" >&2; exit 1; }
          echo "OK: --no-redact keeps raw command text"

          json_cwd="$(./target/release/mnemo runbook --last --format json --group-by cwd)"
          echo "${json_cwd}" | jq -e '.commands | length > 0 and all(.[]; has("group") and (.group | type == "string" and length > 0))' >/dev/null || { echo "FAIL: --group-by cwd missing group fields" >&2; exit 1; }
          cwd_groups="$(echo "${json_cwd}" | jq '[.commands[].group] | unique | length')"
          [ "${cwd_groups}" -ge 2 ] || { echo "FAIL: --group-by cwd should create at least 2 groups" >&2; exit 1; }
          echo "OK: --group-by cwd groups commands"

          json_project="$(./target/release/mnemo runbook --last --format json --group-by project)"
          echo "${json_project}" | jq -e '.commands | length > 0 and all(.[]; has("group") and (.group | type == "string" and length > 0))' >/dev/null || { echo "FAIL: --group-by project missing group fields" >&2; exit 1; }
          project_groups="$(echo "${json_project}" | jq '[.commands[].group] | unique | length')"
          [ "${project_groups}" -ge 2 ] || { echo "FAIL: --group-by project should create at least 2 groups" >&2; exit 1; }
          echo "OK: --group-by project groups commands"
